<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: soft sky blue -->
  <rect width="1024" height="1024" fill="#E3F2FD"/>

  <!-- Grass strip at base -->
  <rect x="0" y="860" width="1024" height="164" fill="#C8E6C9"/>

  <!-- Fallen petals on grass -->
  <ellipse cx="200" cy="880" rx="18" ry="8" fill="#F8BBD0" opacity="0.75" transform="rotate(-20 200 880)"/>
  <ellipse cx="350" cy="900" rx="14" ry="6" fill="#F48FB1" opacity="0.7" transform="rotate(15 350 900)"/>
  <ellipse cx="680" cy="885" rx="16" ry="7" fill="#F8BBD0" opacity="0.75" transform="rotate(-10 680 885)"/>
  <ellipse cx="800" cy="905" rx="12" ry="5" fill="#F48FB1" opacity="0.65" transform="rotate(25 800 905)"/>
  <ellipse cx="900" cy="875" rx="15" ry="6" fill="#F8BBD0" opacity="0.7" transform="rotate(-30 900 875)"/>

  <!-- Trunk -->
  <path d="M462,860 Q455,700 470,600 Q480,520 512,480 Q544,520 554,600 Q569,700 562,860 Z"
        fill="#5D4037"/>
  <!-- Bark texture -->
  <path d="M480,700 Q490,680 488,660" stroke="#4E342E" stroke-width="4" fill="none" opacity="0.5"/>
  <path d="M530,730 Q520,710 522,690" stroke="#4E342E" stroke-width="4" fill="none" opacity="0.5"/>

  <!-- Branch left-low -->
  <path d="M490,620 Q430,570 330,530" stroke="#5D4037" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M330,530 Q270,510 220,480" stroke="#5D4037" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M330,530 Q290,490 260,440" stroke="#5D4037" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Branch right-low -->
  <path d="M534,620 Q594,570 694,530" stroke="#5D4037" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M694,530 Q754,510 804,480" stroke="#5D4037" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M694,530 Q734,490 764,440" stroke="#5D4037" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Branch centre-up -->
  <path d="M512,510 Q500,430 488,350" stroke="#5D4037" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M488,350 Q460,290 420,250" stroke="#5D4037" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M488,350 Q510,280 540,240" stroke="#5D4037" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M488,350 Q500,300 560,290" stroke="#5D4037" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- ── Blossom clusters ───────────────────────────────────────── -->

  <!-- Far left cluster -->
  <circle cx="185" cy="460" r="80" fill="#FCE4EC" opacity="0.95"/>
  <circle cx="155" cy="430" r="65" fill="#F8BBD0" opacity="0.9"/>
  <circle cx="215" cy="410" r="70" fill="#F48FB1" opacity="0.75"/>
  <circle cx="175" cy="395" r="55" fill="#FCE4EC" opacity="0.85"/>

  <!-- Left cluster -->
  <circle cx="295" cy="410" r="85" fill="#F8BBD0" opacity="0.95"/>
  <circle cx="255" cy="380" r="70" fill="#FCE4EC" opacity="0.9"/>
  <circle cx="320" cy="370" r="75" fill="#F48FB1" opacity="0.75"/>
  <circle cx="270" cy="350" r="60" fill="#F8BBD0" opacity="0.85"/>

  <!-- Centre-left cluster -->
  <circle cx="415" cy="350" r="90" fill="#F48FB1" opacity="0.9"/>
  <circle cx="380" cy="310" r="75" fill="#FCE4EC" opacity="0.9"/>
  <circle cx="450" cy="305" r="80" fill="#F8BBD0" opacity="0.85"/>
  <circle cx="410" cy="275" r="65" fill="#F48FB1" opacity="0.8"/>

  <!-- Centre top cluster -->
  <circle cx="512" cy="290" r="95" fill="#FCE4EC" opacity="0.95"/>
  <circle cx="475" cy="245" r="80" fill="#F8BBD0" opacity="0.9"/>
  <circle cx="550" cy="250" r="82" fill="#F48FB1" opacity="0.8"/>
  <circle cx="512" cy="210" r="70" fill="#FCE4EC" opacity="0.9"/>
  <circle cx="490" cy="175" r="58" fill="#F8BBD0" opacity="0.85"/>
  <circle cx="540" cy="170" r="55" fill="#F48FB1" opacity="0.75"/>

  <!-- Centre-right cluster -->
  <circle cx="610" cy="350" r="90" fill="#F8BBD0" opacity="0.9"/>
  <circle cx="650" cy="310" r="75" fill="#FCE4EC" opacity="0.9"/>
  <circle cx="575" cy="305" r="80" fill="#F48FB1" opacity="0.8"/>
  <circle cx="625" cy="275" r="65" fill="#F8BBD0" opacity="0.85"/>

  <!-- Right cluster -->
  <circle cx="730" cy="410" r="85" fill="#FCE4EC" opacity="0.95"/>
  <circle cx="770" cy="380" r="70" fill="#F8BBD0" opacity="0.9"/>
  <circle cx="705" cy="370" r="75" fill="#F48FB1" opacity="0.75"/>
  <circle cx="755" cy="350" r="60" fill="#FCE4EC" opacity="0.85"/>

  <!-- Far right cluster -->
  <circle cx="840" cy="460" r="80" fill="#F8BBD0" opacity="0.95"/>
  <circle cx="870" cy="430" r="65" fill="#FCE4EC" opacity="0.9"/>
  <circle cx="810" cy="410" r="70" fill="#F48FB1" opacity="0.75"/>
  <circle cx="850" cy="395" r="55" fill="#F8BBD0" opacity="0.85"/>

  <!-- ── Five-petal flower details on the densest clusters ──────── -->
  <!-- A few small white 5-petal flowers scattered across blossoms -->
  <g fill="white" opacity="0.6">
    <circle cx="512" cy="210" r="6"/>
    <circle cx="530" cy="200" r="4"/>
    <circle cx="494" cy="202" r="4"/>
    <circle cx="512" cy="192" r="4"/>
    <circle cx="415" cy="285" r="5"/>
    <circle cx="610" cy="280" r="5"/>
    <circle cx="220" cy="415" r="4"/>
    <circle cx="800" cy="415" r="4"/>
    <circle cx="295" cy="355" r="4"/>
    <circle cx="730" cy="355" r="4"/>
  </g>
</svg>
